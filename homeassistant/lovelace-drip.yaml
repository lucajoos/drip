# Drip – Lovelace example
#
# Paste into a dashboard (raw editor) after the integration is set up.
# Entity IDs assume the device is named "Drip". If HA renamed them,
# pick the matching entities from Developer Tools → States.

title: Drip
views:
  - title: Bewässerung
    path: drip
    cards:
      - type: entities
        title: Kräuter
        entities:
          - entity: switch.drip_herbs
          - entity: number.drip_herbs_duration
          - entity: sensor.drip_herbs_remaining
          - entity: sensor.drip_herbs_next_run
          - entity: sensor.drip_herbs_last_run

      - type: entities
        title: Beete
        entities:
          - entity: switch.drip_beds
          - entity: number.drip_beds_duration
          - entity: sensor.drip_beds_remaining
          - entity: sensor.drip_beds_next_run
          - entity: sensor.drip_beds_last_run

      - type: custom:drip-schedules-card
        entity: sensor.drip_schedules

      - type: entities
        title: Wetter & Diagnostik
        entities:
          - entity: sensor.drip_precip_past_24h
          - entity: sensor.drip_precip_next_12h
          - entity: sensor.drip_rssi
          - entity: binary_sensor.drip_rtc
          - entity: sensor.drip_time_source
          - entity: sensor.drip_uptime

# The schedules card is bundled with the integration (no extra Lovelace resource).
